sections:
  - id: template
    title: Templates
    components:
      - id: bootzooka
        name: Bootzooka
        description: Template project to quickly start developing a Scala-based microservice or web application.
        url: https://softwaremill.github.io/bootzooka/
        repo: https://github.com/softwaremill/bootzooka
      - id: adopt-tapir
        name: Adopt Tapir
        description: Generate a Tapir-based project, choosing the target effect system, JSON library, and Tapir features.
        url: https://adopt-tapir.softwaremill.com
        action:
          label: Wizard
          url: https://adopt-tapir.softwaremill.com

  - id: language
    title: Language
    components:
      - id: scala-3
        name: Scala 3
        description: Combines the best features of functional & object-oriented programming.
        url: https://www.scala-lang.org
        repo: https://github.com/scala/scala3

  - id: tooling
    title: Tooling
    components:
      - id: scala-cli
        name: Scala CLI
        description: Command-line tool to compile, run, test, and package Scala code.
        url: https://scala-cli.virtuslab.org
        repo: https://github.com/VirtusLab/scala-cli
      - id: metals
        name: Metals
        description: Scala language server providing IDE features (completions, diagnostics, navigation).
        url: https://scalameta.org/metals/
        repo: https://github.com/scalameta/metals

  - id: backend
    title: Backend
    components:
      - id: tapir
        name: Tapir
        description: Rapid development of self-documenting APIs.
        url: https://tapir.softwaremill.com
        repo: https://github.com/softwaremill/tapir
      - id: sttp
        name: sttp
        description: The Scala HTTP client you always wanted!
        url: https://sttp.softwaremill.com
        repo: https://github.com/softwaremill/sttp
      - id: ox
        name: Ox
        description: Safe direct-style streaming, concurrency and resiliency for Scala on the JVM.
        url: https://ox.softwaremill.com
        repo: https://github.com/softwaremill/ox
      - id: parlance
        name: Parlance
        description: High-velocity, opinionated functional ORM inspired by Active Record patterns.
        url: https://github.com/lbialy/parlance
      - id: macwire
        name: MacWire
        description: Zero-cost, compile-time, type-safe dependency injection library.
        url: https://github.com/softwaremill/macwire
      - id: quicklens
        name: Quicklens
        description: Modify deeply nested case class fields.
        url: https://github.com/softwaremill/quicklens

  - id: ai
    title: AI tooling
    components:
      - id: sttp-ai
        name: sttp-ai
        description: Scala toolkit for working with third-party LLMs. Define agents, call provider APIs, use MCPs.
        url: https://sttp-ai.softwaremill.com
        repo: https://github.com/softwaremill/sttp-ai
      - id: scala-skill
        name: scala-skill
        description: "Claude Code & Codex Scala Skills: generate direct-style applications with use-case driven guides."
        url: https://github.com/VirtusLab/scala-skill
      - id: chimp
        name: Chimp
        description: Build type-safe, boilerplate-less MCP servers and clients in Scala.
        url: https://chimp.softwaremill.com
        repo: https://github.com/softwaremill/chimp
      - id: orca
        name: Orca
        description: Deterministic, AI-driven development flows.
        url: https://github.com/VirtusLab/orca
      - id: cellar
        name: Cellar
        description: CLI tool for coding agents and developers to query the public API of any Maven JVM dependency.
        url: https://github.com/VirtusLab/cellar
      - id: sandcat
        name: Sandcat
        description: A Docker & dev container setup for securely running AI agents in `--dangerous` mode.
        url: https://github.com/VirtusLab/sandcat

  - id: devops
    title: DevOps
    components:
      - id: besom
        name: Besom
        description: Pulumi SDK for Scala.
        url: https://virtuslab.github.io/besom/
        repo: https://github.com/VirtusLab/besom

commercial:
  id: visdom
  name: Visdom
  description: "AI-native SDLC platform: the missing layer between AI coding and production"
  url: https://visdom.virtuslab.com
