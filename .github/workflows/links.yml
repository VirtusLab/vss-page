name: Check links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Scala CLI
        uses: VirtusLab/scala-cli-setup@v1
        with:
          jvm: temurin:21
      - name: Cache Coursier
        uses: actions/cache@v6
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('snippets/*.scala') }}
          restore-keys: coursier-
      - name: Compile snippets
        run: ./scripts/compile-snippets.sh
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Check links
        run: npm run check-links
